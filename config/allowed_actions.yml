# Allowed servicing actions. The agent may only recommend actions returned by get_allowed_actions.
# SYNTHETIC ASSUMPTIONS: action catalog and mappings are illustrative and configurable.
version: actions-2026.10.1
synthetic_assumption: true

actions:
  NO_ACTION:
    description: Record that no servicing action is needed now.
    creates_event: false
  CREATE_FOLLOWUP:
    description: Create a follow-up event for the current milestone.
    creates_event: true
    event_type: FOLLOWUP
    followup_days: milestone_default
  CREATE_NEXT_MILESTONE:
    description: Open the configured next milestone.
    creates_event: true
    event_type: MILESTONE
    milestone: next
    followup_days: next_milestone_default
  ESCALATE_TO_SPECIALIST:
    description: Escalate the loan to a senior servicing specialist.
    creates_event: true
    event_type: ESCALATION
    followup_days: 3
  CONTACT_ATTORNEY:
    description: Prepare an outreach request to the assigned synthetic legal vendor.
    creates_event: true
    event_type: CONTACT
    followup_days: 7
    requires_party_type: ATTORNEY
  CONTACT_SERVICING_VENDOR:
    description: Prepare an outreach request to the assigned synthetic servicing vendor.
    creates_event: true
    event_type: CONTACT
    followup_days: 7
    requires_party_type: VENDOR
  REQUEST_INFORMATION:
    description: Request missing information needed to continue servicing.
    creates_event: true
    event_type: INFO_REQUEST
    followup_days: 5
  REVIEW_DATA_EXCEPTION:
    description: Create a data-review task to resolve missing, duplicate, or conflicting records.
    creates_event: true
    event_type: DATA_REVIEW
    followup_days: 2
  RETRY_FAILED_ACTION:
    description: Resubmit the most recent failed or unverified action.
    creates_event: true
    event_type: from_original_action
    followup_days: 5

# Ordered allowed actions by primary condition. The first entry is the deterministic default.
# MILESTONE_OVERDUE_ACTION resolves to the current milestone rule's overdue_action.
by_condition:
  NO_ACTION: [NO_ACTION]
  COMPLETED: [NO_ACTION]
  UPCOMING: [NO_ACTION, MILESTONE_OVERDUE_ACTION]
  DUE: [MILESTONE_OVERDUE_ACTION, CREATE_FOLLOWUP, NO_ACTION]
  OVERDUE: [MILESTONE_OVERDUE_ACTION, CREATE_FOLLOWUP, REQUEST_INFORMATION]
  MISSING_FOLLOWUP: [CREATE_FOLLOWUP, REQUEST_INFORMATION]
  COMPLETED_NEEDS_NEXT: [CREATE_NEXT_MILESTONE, REQUEST_INFORMATION]
  DUPLICATE_RISK: [REVIEW_DATA_EXCEPTION, NO_ACTION]
  DATA_EXCEPTION: [REVIEW_DATA_EXCEPTION, REQUEST_INFORMATION]
  PENDING_REVIEW: [NO_ACTION]
  PENDING_ACTION: [NO_ACTION]
  ALREADY_ACTIONED: [NO_ACTION]
  VERIFICATION_FAILURE: [RETRY_FAILED_ACTION, REVIEW_DATA_EXCEPTION]

# When the latest action's verification status is listed, these lists replace VERIFICATION_FAILURE's list.
verification_overrides:
  MISMATCH: [REVIEW_DATA_EXCEPTION, RETRY_FAILED_ACTION]
  DUPLICATE: [REVIEW_DATA_EXCEPTION]

# Escalation adjustments. "prepend" makes the action the deterministic default.
escalation_adjustments:
  ESCALATE: { append: [ESCALATE_TO_SPECIALIST] }
  CRITICAL: { prepend: [ESCALATE_TO_SPECIALIST] }

# Conditions where escalation adjustments never apply (the loan is already covered or not actionable).
escalation_adjustment_exempt_conditions: [NO_ACTION, COMPLETED, PENDING_ACTION, ALREADY_ACTIONED, PENDING_REVIEW]
