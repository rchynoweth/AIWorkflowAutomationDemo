# Loan Servicing Intelligence - application configuration.
# SYNTHETIC DEMONSTRATION: all values are illustrative assumptions, not any lender's settings.
application:
  name: Loan Servicing Intelligence
  subtitle: Agent-powered portfolio monitoring and loan-servicing workflow automation
  synthetic_label: Synthetic Demonstration Data
  version: 0.1.0

processing:
  # Fixed processing date keeps demo scenarios deterministic. Override with LSI_PROCESSING_DATE.
  processing_date: "2026-10-12"

versions:
  rule_version: rules-2026.10.1
  scoring_version: scoring-2026.10.1
  agent_version: lsa-0.1.0

data:
  seed: 20261012
  loan_count: 1500
  generated_dir: data/generated
  landing_dir: data/landing
  outbound_dir: data/outbound
  processed_dir: data/processed

repository:
  backend: local            # local | databricks  (env: LSI_REPOSITORY_BACKEND)

databricks:
  catalog: main             # env: LSI_CATALOG
  schema: loan_servicing_intelligence   # env: LSI_SCHEMA
  landing_volume: landing
  warehouse_id: ""          # env: DATABRICKS_WAREHOUSE_ID

agent:
  mode: auto                # auto | llm | deterministic  (env: LSI_AGENT_MODE)
  model_endpoint: databricks-claude-sonnet-5-5   # pay-per-token Foundation Model API (env: LSI_MODEL_ENDPOINT)
  max_tool_iterations: 12
  temperature: null        # omitted when null (some Claude endpoints reject the parameter)
  max_tokens: 2500
  request_timeout_seconds: 90

api:
  host: 127.0.0.1
  port: 8001                # env: LSI_API_PORT

review:
  reviewer_roles:
    - LOAN_SERVICING_SPECIALIST
    - SENIOR_SPECIALIST
    - SERVICING_MANAGER
  default_reviewer_id: SPEC-01
  default_reviewer_role: LOAN_SERVICING_SPECIALIST
