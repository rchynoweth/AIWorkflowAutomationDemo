# Demo-mode scenario configuration (SYNTHETIC).
demo_mode: true

# Synthetic adapter behavior per loan. Modes: SUCCESS, FAIL, MISMATCH, DUPLICATE, DELAYED.
adapter:
  default_mode: SUCCESS
  mismatch_shift_days: 7        # MISMATCH writes the follow-up date shifted by this many days
  delayed_cycles: 2             # DELAYED events become visible this many refresh cycles later
  loan_modes:
    LSI-SYN-000004: FAIL        # one-day overdue loan: live demo of a configured failure
    LSI-SYN-000013: MISMATCH    # prior-rejection loan: approving shows a mismatch on refresh
    LSI-SYN-000008: DUPLICATE   # missing follow-up loan: approving shows a duplicate on refresh
    LSI-SYN-000003: DELAYED     # due-today loan: approving shows PENDING until two refreshes later

# Loans highlighted in the demo script.
spotlight:
  main_path: LSI-SYN-000005
  critical: LSI-SYN-000006
  configured_failure: LSI-SYN-000004
  prior_failed_verification: LSI-SYN-000016
  covered_by_pending: LSI-SYN-000019

# Baseline recommendations generated by the deterministic agent for attention candidates on reset/pipeline.
baseline_recommendations:
  enabled: true
  exclude_loans: [LSI-SYN-000005, LSI-SYN-000004]   # left un-analyzed so the demo can run the agent live
