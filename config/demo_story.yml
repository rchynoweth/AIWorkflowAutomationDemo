# Presenter talk track, shown on each page when "Presenter notes" is on (sidebar).
# Two tracks per page: "story" (the servicing use case) and "databricks" (the platform capability).
# Edit freely; no code changes needed. All data in the demo is synthetic; the AI outputs are real.

page_notes:
  portfolio:
    story:
      - "Every active loan is evaluated every cycle - nobody searches for work. The purple text was written by AI before anyone opened the app."
      - "Agent review shows loans the agent already investigated overnight, with its recommended action."
    databricks:
      - "The AI summaries come from AI Functions - ai_query in a SQL notebook - and the reviews from the deployed agent, both in one serverless Databricks Workflow."
      - "The app only reads Gold tables in Unity Catalog through a serverless SQL warehouse."
  loan:
    story:
      - "Left: deterministic facts from the rules engine, each with a rule ID. Right: what the AI backend already concluded."
      - "Run AI analysis now: the agent investigates live and shows every tool it chose. It recommends; a person decides."
      - "Pick a custom instruction - for example draft an email to the attorney - to steer the same agent for this request."
    databricks:
      - "The on-demand call goes to the Loan Servicing Agent on Model Serving; its tools are Unity Catalog functions and every call is traced in MLflow."
  agent:
    story:
      - "Ask a loan question and watch the agent pick its own tools, then show the tool catalog."
    databricks:
      - "Mosaic AI Agent Framework, registered in Unity Catalog, served on Model Serving with scale-to-zero; tools are governed Unity Catalog SQL functions; AI Playground and MLflow traces."
  how_it_works:
    story:
      - "Databricks is the backend: one workflow builds the facts, the AI, and the agent reviews. The app is a thin window."
    databricks:
      - "Open the workflow run, the AI Functions notebook, and the agent in Databricks from the links at the bottom."
