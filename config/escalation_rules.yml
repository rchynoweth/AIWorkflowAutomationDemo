# Deterministic escalation rules. Every matching rule contributes a reason; the highest state wins.
# SYNTHETIC ASSUMPTIONS: thresholds are illustrative and configurable.
version: escalation-2026.10.1
synthetic_assumption: true
states_order: [NONE, WATCH, FOLLOW_UP, ESCALATE, CRITICAL]

required_roles:
  NONE: NONE
  WATCH: LOAN_SERVICING_SPECIALIST
  FOLLOW_UP: LOAN_SERVICING_SPECIALIST
  ESCALATE: SENIOR_SPECIALIST
  CRITICAL: SERVICING_MANAGER

rules:
  - id: RULE-ESCALATION-001
    state: CRITICAL
    reason: Follow-up materially past due (60+ days overdue).
    when: { min_days_overdue: 60, primary_condition_not_in: [ALREADY_ACTIONED, PENDING_ACTION] }
  - id: RULE-ESCALATION-002
    state: CRITICAL
    reason: Highest-severity milestone overdue 15+ days.
    when: { min_severity: 5, min_days_overdue: 15, primary_condition_not_in: [ALREADY_ACTIONED, PENDING_ACTION] }
  - id: RULE-ESCALATION-003
    state: CRITICAL
    reason: Highest-severity milestone follow-up inside the configured critical-date window.
    when: { min_severity: 5, max_days_to_followup: 5, milestone_incomplete: true, primary_condition_not_in: [ALREADY_ACTIONED, PENDING_ACTION] }
  - id: RULE-ESCALATION-004
    state: CRITICAL
    reason: Two or more failed or unverified actions inside the failure lookback.
    when: { min_failed_actions: 2 }
  - id: RULE-ESCALATION-005
    state: ESCALATE
    reason: Follow-up 30+ days overdue.
    when: { min_days_overdue: 30, primary_condition_not_in: [ALREADY_ACTIONED, PENDING_ACTION] }
  - id: RULE-ESCALATION-006
    state: ESCALATE
    reason: An approved action failed verification.
    when: { any_condition: [VERIFICATION_FAILURE] }
  - id: RULE-ESCALATION-007
    state: ESCALATE
    reason: Required attorney or servicing vendor is not assigned.
    when: { missing_assigned_party: true }
  - id: RULE-ESCALATION-008
    state: ESCALATE
    reason: A prior recommendation was rejected and the loan remains 15+ days overdue.
    when: { prior_rejection: true, min_days_overdue: 15 }
  - id: RULE-ESCALATION-009
    state: FOLLOW_UP
    reason: Actionable servicing condition requires specialist follow-up.
    when: { primary_condition_in: [OVERDUE, DUE, MISSING_FOLLOWUP, COMPLETED_NEEDS_NEXT, DUPLICATE_RISK, DATA_EXCEPTION, VERIFICATION_FAILURE] }
  - id: RULE-ESCALATION-010
    state: WATCH
    reason: Condition should be monitored but needs no new action today.
    when: { primary_condition_in: [UPCOMING, PENDING_ACTION, PENDING_REVIEW, ALREADY_ACTIONED] }

# Portfolio health segments derived from escalation state.
health_segments:
  NONE: Healthy
  WATCH: Watch
  FOLLOW_UP: Action Required
  ESCALATE: Action Required
  CRITICAL: Critical
