# Databricks App: Loan Servicing Intelligence (synthetic demonstration data).
command: ["streamlit", "run", "app/main.py", "--server.port", "8000", "--server.address", "0.0.0.0"]
env:
  - name: LSI_CATALOG
    value: "main"
  - name: LSI_SCHEMA
    value: "loan_servicing_intelligence"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
