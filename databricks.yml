# Databricks Asset Bundle for Loan Servicing Intelligence (synthetic demonstration).
# Alternative to scripts/create_pipeline_job.py + scripts/deploy_app.py for CI/CD-style deployment.
# All compute is serverless (no cluster definitions). Host/profile come from your CLI configuration.
bundle:
  name: loan-servicing-intelligence

variables:
  catalog:
    default: main
  schema:
    default: loan_servicing_intelligence
  warehouse_id:
    description: Serverless SQL warehouse ID used by the app
  model_endpoint:
    default: databricks-claude-sonnet-5-5

sync:
  exclude:
    - data/landing/**
    - data/outbound/**
    - data/processed/**
    - tests/**

resources:
  jobs:
    lsi_pipeline:
      name: lsi-pipeline-bundle
      max_concurrent_runs: 1
      tags:
        project: loan-servicing-intelligence
        synthetic_data: "true"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: processing_date
          default: "2026-10-12"
      tasks:
        - task_key: generate
          notebook_task: { notebook_path: ./notebooks/01_generate_demo_data.py }
        - task_key: bronze
          depends_on: [{ task_key: generate }]
          notebook_task: { notebook_path: ./notebooks/02_ingest_bronze.py }
        - task_key: silver
          depends_on: [{ task_key: bronze }]
          notebook_task: { notebook_path: ./notebooks/03_build_silver.py }
        - task_key: gold
          depends_on: [{ task_key: silver }]
          notebook_task: { notebook_path: ./notebooks/04_build_gold.py }
        - task_key: tools
          depends_on: [{ task_key: gold }]
          notebook_task: { notebook_path: ./notebooks/05_register_agent_tools.py }
        - task_key: evaluate
          depends_on: [{ task_key: gold }]
          notebook_task: { notebook_path: ./notebooks/06_run_evaluation.py }

  apps:
    loan_servicing_intelligence:
      name: loan-servicing-intelligence
      description: Agent-powered portfolio monitoring and loan-servicing workflow automation (synthetic).
      source_code_path: .
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.model_endpoint}
            permission: CAN_QUERY

targets:
  dev:
    mode: development
    default: true
